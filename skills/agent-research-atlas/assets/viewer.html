<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Research Atlas</title>
<style>
:root{color-scheme:light;--ink:#17332e;--muted:#5c716d;--bg:#f5f6f2;--line:#d7e2da;--green:#17735a;--amber:#a9610b;--red:#a53434}*{box-sizing:border-box}body{font:15px/1.55 system-ui,sans-serif;color:var(--ink);background:var(--bg);margin:0}header{padding:30px 4vw 22px;background:#143c33;color:#fff}header h1{font-size:30px;margin:0 0 8px;letter-spacing:-.6px}header p{margin:0;color:#d2e7dc}.badge{display:inline-block;padding:4px 9px;border-radius:12px;background:#dcece3;color:var(--ink);font-size:12px;margin:3px}.synthetic{background:#ffe3a8;color:#6b3900;font-weight:bold}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:22px 4vw}input,select,button{font:inherit;border:1px solid var(--line);border-radius:8px;background:white;padding:9px 12px;color:var(--ink)}input{flex:1;min-width:230px}button{cursor:pointer}button:hover,button:focus{border-color:var(--green)}main{margin:0 4vw 32px}.metrics{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;overflow:auto}#canvas{width:100%;height:640px;display:block;background:#fcfdfb;border-radius:8px}svg text{font:11px system-ui;fill:var(--ink)}svg .edge{stroke:#94b5a8;stroke-width:1.6}svg .node{cursor:pointer;outline:none}svg .node:hover circle,svg .node:focus circle{stroke:#111;stroke-width:3}#detail h2{font-size:19px;margin-top:0}#detail h3{font-size:14px;margin-bottom:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,monospace;background:#f6f8f5;padding:12px;border-radius:8px}a{color:var(--green);overflow-wrap:anywhere}#records{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:20px}.card{text-align:left;padding:16px;overflow-wrap:anywhere}.card strong{display:block}.card small{color:var(--muted)}.legend{font-size:13px;color:var(--muted);margin:8px 0}.empty{padding:22px;color:var(--muted)}footer{margin-top:24px;color:var(--muted);font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}#canvas{height:480px}}@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}} 
</style>
<header><h1 id="title">Agent Research Atlas</h1><p>研究方向 · 文献证据 · 可检验假设 · 实验与探索记忆</p><div id="meta"></div></header>
<div class="toolbar"><input id="search" aria-label="搜索中英文记录" placeholder="搜索问题、论文、机制、失败原因…"><select id="domain" aria-label="研究方向"><option value="">所有方向 / All domains</option></select><select id="type" aria-label="记录类型"><option value="">所有类型 / All types</option></select><select id="status" aria-label="证据状态"><option value="">所有状态 / All statuses</option></select><button id="reset">重置</button></div>
<main><div id="metrics" class="metrics"></div><div class="layout"><section class="panel"><h2>关系地图</h2><p class="legend">实线表示已记录关系，虚线表示目录归属；位置只用于排版。点击节点查看证据。覆盖状态只反映本项目已探索范围。</p><svg id="canvas" viewBox="0 0 1000 720" role="img" aria-label="可筛选的科研关系图"></svg><p id="graphnote" class="legend"></p></section><aside class="panel" id="detail" aria-live="polite"><h2>选择一条记录</h2><p>领域目录是可扩展的起点。没有记录的方向仍属于未探索范围。</p></aside></div><h2>记录索引</h2><div id="records"></div><footer>本页面不请求网络资源，不执行搜索，不自动修改研究数据。调用 Skill 更新 atlas.json 后重新生成并刷新本页。手写内容放入各领域 notes.md。结构完整与论文可发表性是不同判断。</footer></main>
<script id="atlas-data" type="application/json">__ATLAS_DATA__</script>
<script>
'use strict';
const atlas=JSON.parse(document.getElementById('atlas-data').textContent);
const $=id=>document.getElementById(id), domains=atlas.nodes.filter(n=>n.type==='domain');
const labels={domain:'领域',paper:'论文',problem:'问题',hypothesis:'假设',experiment:'实验',claim:'论点',decision:'决策',exploration:'检索'};
const colors={domain:'#1c725e',paper:'#5d85b2',problem:'#d2974a',hypothesis:'#9977b6',experiment:'#458d95',claim:'#747c46',decision:'#b57969',exploration:'#849c94'};
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const badge=(where,text,cls='')=>where.append(el('span',text,'badge '+cls));
$('title').textContent=atlas.project.title;
badge($('meta'),'Revision '+atlas.revision);badge($('meta'),'Updated '+atlas.project.updated_at);
if(atlas.project.synthetic)badge($('meta'),'SYNTHETIC 示例：不可用于科研论证','synthetic');
for(const d of domains){const opt=el('option',d.title);opt.value=d.id;$('domain').append(opt)}
for(const t of Object.keys(labels)){const opt=el('option',labels[t]+' / '+t);opt.value=t;$('type').append(opt)}
const states=[...new Set(atlas.nodes.map(n=>n.type==='domain'?n.data.coverage:n.status||'recorded'))].sort();
for(const s of states){const opt=el('option',s);opt.value=s;$('status').append(opt)}
function source(parent,s){const row=el('p');const target=s.url||s.path;let link;
 try{const u=new URL(target);if(['https:','http:'].includes(u.protocol)){link=el('a',target);link.href=u.href;link.target='_blank';link.rel='noopener noreferrer'}}catch{}
 row.append(link||el('span',target||'Unknown source'));row.append(el('small',' — '+s.access+' · '+(s.locator||'metadata only')+' · '+s.accessed_at));parent.append(row)}
function show(n){const p=$('detail');p.replaceChildren(el('h2',n.title));badge(p,labels[n.type]||n.type);badge(p,n.type==='domain'?n.data.coverage:n.status||'recorded');p.append(el('p',n.id));p.append(el('h3','结构化记录 / Recorded details'));p.append(el('pre',JSON.stringify(n.data||{},null,2)));
 if(n.sources?.length){p.append(el('h3','来源与读取范围'));n.sources.forEach(s=>source(p,s))}
 const edges=atlas.edges.filter(e=>e.source===n.id||e.target===n.id);if(edges.length){p.append(el('h3','关联记录'));for(const e of edges){const other=atlas.nodes.find(x=>x.id===(e.source===n.id?e.target:e.source));const b=el('button',e.relation+' → '+other.title);b.onclick=()=>show(other);p.append(b)}}}
function svg(tag,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function draw(nodes){const canvas=$('canvas');canvas.replaceChildren();const visible=nodes.slice(0,140), ids=new Set(visible.map(n=>n.id));const groups=new Map();visible.forEach(n=>{if(!groups.has(n.type))groups.set(n.type,[]);groups.get(n.type).push(n)});const points=new Map();let row=0,totalRows=[...groups.values()].reduce((s,g)=>s+Math.ceil(g.length/5),0);const height=Math.max(720,totalRows*110+80);canvas.setAttribute('viewBox','0 0 1000 '+height);
 for(const group of groups.values()){group.forEach((n,i)=>points.set(n.id,{x:90+(i%5)*200,y:60+(row+Math.floor(i/5))*110}));row+=Math.ceil(group.length/5)}
 const defs=svg('defs',{}), marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:5,markerHeight:5,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#94b5a8'}));defs.append(marker);canvas.append(defs);
 for(const n of visible){for(const d of n.domains||[]){if(ids.has(d)){const a=points.get(d),b=points.get(n.id),line=svg('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'edge','stroke-dasharray':'4 6',opacity:.5});const title=svg('title',{});title.textContent='Domain membership / 目录归属';line.append(title);canvas.append(line)}}}
 for(const e of atlas.edges){if(ids.has(e.source)&&ids.has(e.target)){const a=points.get(e.source),b=points.get(e.target),line=svg('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'edge','marker-end':'url(#arrow)'});const title=svg('title',{});title.textContent=e.relation;line.append(title);canvas.append(line)}}
 for(const n of visible){const p=points.get(n.id),g=svg('g',{class:'node',tabindex:0,role:'button','aria-label':n.title,transform:`translate(${p.x},${p.y})`});g.append(svg('circle',{r:17,fill:colors[n.type]||'#888'}));const text=svg('text',{y:36,'text-anchor':'middle'});text.textContent=n.title.length>21?n.title.slice(0,20)+'…':n.title;g.append(text);const title=svg('title',{});title.textContent=n.title;g.append(title);g.onclick=()=>show(n);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(n)}};canvas.append(g)}
 $('graphnote').textContent=nodes.length>140?'地图当前展示前 140 个匹配节点；完整匹配记录见下方索引。请按方向筛选查看其余节点。':`显示 ${visible.length} 个节点。孤立节点表示尚未记录显式关联，不表示没有学术联系。`;}
function render(){const q=$('search').value.trim().toLocaleLowerCase(),d=$('domain').value,t=$('type').value,s=$('status').value;const nodes=atlas.nodes.filter(n=>(!q||JSON.stringify(n).toLocaleLowerCase().includes(q))&&(!d||n.id===d||n.domains?.includes(d))&&(!t||n.type===t)&&(!s||(n.type==='domain'?n.data.coverage:n.status||'recorded')===s));$('metrics').replaceChildren();badge($('metrics'),`${nodes.length} / ${atlas.nodes.length} 条匹配记录`);for(const state of ['unsearched','partial','reviewed','stale'])badge($('metrics'),`${state}: ${domains.filter(d=>d.data.coverage===state).length}`);draw(nodes);const records=$('records');records.replaceChildren();for(const n of nodes){const b=el('button',undefined,'card');b.append(el('strong',n.title),el('small',(labels[n.type]||n.type)+' · '+(n.type==='domain'?n.data.coverage:n.status||'recorded')));b.onclick=()=>show(n);records.append(b)}if(!nodes.length)records.append(el('p','没有匹配记录。请调整筛选条件。','empty'));}
for(const id of ['search','domain','type','status'])$(id).addEventListener('input',render);$('reset').onclick=()=>{for(const id of ['search','domain','type','status'])$(id).value='';render()};render();
</script>
</html>
