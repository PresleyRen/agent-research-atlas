name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Compile bundled scripts
        run: python -m py_compile skills/agent-research-atlas/scripts/*.py
      - name: Validate capability and extension references
        run: python skills/agent-research-atlas/scripts/audit.py check --repo .
